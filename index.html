<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Time Series Rank Chart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="overlay">
        <h1>Time Series Value & Position Changes</h1>
        <p class="hotkeys-info">Press <strong>Spacebar</strong> to play/pause animation.</p>
        <p class="hotkeys-info">Use <strong>&larr;</strong> and <strong>&rarr;</strong> arrows to manually step backward and forward.</p>
    </div>
    <div id="chart-container"></div>
    <script src="script.js"></script>
</body>
</html>
